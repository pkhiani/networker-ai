<!DOCTYPE html>
<html>
<head>
    <title>Message History Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="dashboard.css">
    <link href='https://fonts.googleapis.com/css?family=Source+Sans+Pro' rel='stylesheet' type='text/css'>
</head>
<body>
    <div class="dashboard-container">
        <h2>Search LinkedIn Prospects</h2>
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Enter job title and company (e.g., Product Manager at Google)">
            <button id="searchButton">Search</button>
            <div id="searchResults" class="search-results">
                <!-- Search results will be displayed here -->
            </div>
        </div>

        <h2>Generated Messages History</h2>
        <div id="messagesList" class="messages-list">
            <!-- Messages will be populated here -->
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
